# 업로드 녹음("사"x2 + 길게 끈 치찰음x2, 44.1k)에서 화자 목소리를 추출해
# (analysis/extract -> profiles/me.json) 재구성한 예제.
#
# 반영한 것:
#   * 목소리: 실측 F0 126 Hz, 포먼트, Rd/tilt, 치찰음 지문(앞니 공명 ~10 kHz).
#   * 치찰음 파라미터가 실시간으로 변한다: 혀가 협착에서 모음으로 이동하며
#     앞공동이 길어져 무게중심이 내려간다(실측 6700->3900 Hz). sib_* 를 곡선으로.
#   * 구강 공명: noise_back_leak 을 키워 협착 뒤 공동(성도 전체)까지 결합시킨다.
#     모음으로 갈수록 커져 vowel 포먼트가 마찰음 끝에 얹힌다(동시조음).
#   * 유량 페이드는 실측 포락선에 맞춰 자연스럽게(너무 느리지 않게).
#   * 치찰음을 풀면 성문하압이 남아 첫 모음 '으'가 눌려(pressed) 나온다 —
#     과하지 않게. '으'(압력)->'아'(이완). /s/ 는 모음보다 ~-11 dB(실측).
#
#   PYTHONPATH=src python -m formant_ml.render \
#       examples/me_sibilant_release.yaml -o out/me_sibilant_release.wav
name: 치찰음 -> 으아 (내 목소리)
voice: ../profiles/me.json
seed: 5
smooth_frames: 3

timeline:
  # 길게 끄는 치찰음: 실측 궤적(조이며 오르고 해제하며 내려감) + 구강 결합 증가
  - {type: fricative, phone: s, dur: 0.55, fade_in: 0.16, fade_out: 0.05,
     level_db: -8,
     sib_teeth_f: [[0, 8600], [0.4, 10000], [0.8, 9600], [1, 6800]],
     sib_pole_f:  [[0, 4600], [0.5, 5300], [1, 3800]],
     noise_back_leak: [[0, 0.15], [1, 0.4]]}

  # '으아': 압력이 실린 '으'(과하지 않게)로 시작해 '아'로 이완
  - {type: glide, vowels: [eu, a], dur: 0.5,
     pressure: [[0, 1.25], [0.25, 1.06], [1, 0.8]],
     adduction: 0.9,
     f0: [[0, 138], [0.3, 131], [1, 123]],
     tilt: [[0, 9.5], [1, 8.75]]}
