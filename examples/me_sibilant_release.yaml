# 업로드 녹음("사"x2 + 길게 끈 치찰음x2)에서 화자 목소리를 추출(profiles/me.json)해
# 공기음향(aeroacoustic) 물리로 재구성한 예제.
#
# 이번 판의 핵심(문헌 기반):
#   * 난류 소스가 임계 레이놀즈수에서 켜진다(Stevens 1971): 협착 면적이 열리면
#     입자속도가 떨어져 Re<Re_c → 마찰음이 저절로 꺼진다. 임의 페이드가 아니다.
#   * 소스 세기 ∝ 협착 압력강하 ½ρ(U/A)² (Stevens 1971).
#   * 무게중심이 입자속도와 함께 오른다(Stevens 1971): 협착이 열리며 내려간다.
#     실측 /사/ 의 무게중심 하강(6700→3900)이 곡선이 아니라 면적에서 유도된다.
#   * 폐압이 성문·구강 협착을 직렬로 지나 하나의 유량을 만든다 → 발성·기식·마찰음이
#     같은 구동에서 결합된다. 발성이 시작되며 성문이 닫히면 마찰음도 함께 꺼진다.
#   * 치찰음을 풀면 남은 성문하압으로 첫 모음 '으'가 눌린다(pressed), 과하지 않게.
#
#   PYTHONPATH=src python -m formant_ml.render \
#       examples/me_sibilant_release.yaml -o out/me_sibilant_release.wav
name: 치찰음 -> 으아 (내 목소리, 공기음향)
voice: ../profiles/me.json
seed: 5
smooth_frames: 2

timeline:
  # 길게 끄는 치찰음: 협착을 유지하다(hold) 서서히 연다(release). 레이놀즈 게이트가
  # 켜고 끈다. 면적 곡선을 직접 줘서 무게중심 궤적(조이며↑, 풀며↓)을 만든다.
  - {type: fricative, phone: s, dur: 0.55, aero: true,
     constriction_area: [[0, 0.5], [0.12, 0.11], [0.5, 0.10], [0.8, 0.16],
                         [0.92, 0.6], [1, 2.5]],
     glottal_area: 0.12, level_db: -6}

  # '으아': 압력 실린 '으'(과하지 않게) -> '아' 이완
  - {type: glide, vowels: [eu, a], dur: 0.5,
     pressure: [[0, 1.25], [0.25, 1.06], [1, 0.8]], adduction: 0.9,
     f0: [[0, 138], [0.3, 131], [1, 123]],
     tilt: [[0, 9.5], [1, 8.75]]}
