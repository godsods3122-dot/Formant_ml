# 업로드 녹음에서 화자 목소리를 추출(profiles/me.json)해 공기음향 물리로 재구성.
#
# 이번 판의 핵심:
#   * 구강내압: /s/ 는 협착이 좁아 협착 뒤에 Ps 의 60~70% 가 쌓이고, 그만큼 성대를
#     구동할 압력이 없어 목소리가 눌린다. 협착을 풀면 τ=V/(c·Ac) 로 빠지는데
#     Ac 가 커질수록 21 ms -> 0.6 ms 로 급락해 빠르고 부드럽게 사라진다.
#     그 순간 (Ps-Pm) 이 발성 역치를 넘어 목소리가 붙는다 -> VOT 가 유도된다.
#   * 호흡 압력은 곡선이다. /s/ 를 내려면 상당한 압력이 필요하고 그걸 툭 던지지
#     않는다 — 서서히 올렸다 서서히 내린다. 압력이 낮은 동안은 레이놀즈 게이트가
#     난류를 안 켜므로 이 램프가 그대로 페이드 인/아웃이 된다. 상수로 두면
#     첫 프레임부터 최대라 그 급개시가 파열음(/k/)으로 들린다.
#   * '으' 는 별도 모음이 아니라 /s/ 자세(혀가 /이/ 보다 높음)의 잔상이다.
#     로커스(F2 2250)에서 출발해 60 ms 안에 '아'(F2 1292)로 간다. 길게 끌면
#     그게 /j/ 활음이라 "야" 로 들린다.
#
#   PYTHONPATH=src python -m formant_ml.render \
#       examples/me_sibilant_release.yaml -o out/me_sibilant_release.wav
name: 치찰음 -> 으아 (내 목소리, 공기음향)
voice: ../profiles/me.json
seed: 5
smooth_frames: 2

timeline:
  - {type: syllable, onset: s, vowel: a, dur: 1.05, onset_s: 0.55,
     aero: true, transition_s: 0.12,
     constriction_area: [[0, 0.5], [0.08, 0.12], [0.45, 0.10],
                         [0.52, 0.18], [0.56, 1.0], [0.63, 3.0], [1, 3.0]],
     f0: [[0, 131], [1, 122]]}
