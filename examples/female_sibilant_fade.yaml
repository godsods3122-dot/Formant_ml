# 실측 녹음("사" 2회 + 길게 끈 치찰음 2회, 44.1k)에서 치찰음 지문을 뽑아
# (analysis/sibilant.fit_sibilant, rmse 1.05 dB) 여성 프로파일에 넣고 재구성한 예제.
#
# 핵심 두 가지:
#   1) 치찰음 음량은 협착부 유량(부피속도)을 따라간다 → fade_in/fade_out(초).
#   2) 길게 끈 치찰음을 풀면 성문하압이 이미 높아, 첫 모음 '으'가 눌려(pressed)
#      나온다. pressure/adduction 을 주면 세기·F0·성문파 형상(Rd)이 함께 따라온다
#      (aerodynamics). '으'에서 압력이 실렸다가 '아'로 이완한다.
#
# 레벨: /s/ 는 모음보다 약 -11 dB (실측치). fricative 의 level_db 로 맞춘다.
#
#   PYTHONPATH=src python -m formant_ml.render \
#       examples/female_sibilant_fade.yaml -o out/female_sibilant_fade.wav
name: 여성 치찰음 -> 으아
voice: ../profiles/female_ko.json
seed: 5
smooth_frames: 3

timeline:
  # 길게 끄는 치찰음: 유량이 붙으며 부드럽게 들어와 발성 직전까지 유지
  - {type: fricative, phone: s, dur: 0.9, fade_in: 0.24, fade_out: 0.03,
     level_db: 4}

  # '으아': 압력이 실린 눌린 '으'로 시작해 '아'로 이완.
  #   pressure 가 높으면 세고(amp↑), F0 가 오르고, 성문이 완전히 닫혀 Rd 가
  #   작아진다(pressed). '아' 로 가며 압력을 풀면 다시 이완된다.
  - {type: glide, vowels: [eu, a], dur: 0.62,
     pressure: [[0, 1.5], [0.2, 1.25], [1, 0.82]],
     adduction: 0.95,
     f0: [[0, 203], [0.28, 195], [1, 182]],
     tilt: [[0, 3.5], [1, 0.0]]}
