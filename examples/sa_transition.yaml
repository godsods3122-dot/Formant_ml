# 치찰음 -> 모음 전이 실험. 세 손잡이가 전이를 만든다.
#   onset_ratio      마찰음이 끝나는 위치 (0~1)
#   vot              마찰 종료 -> 성대 진동 시작까지 [초]
#   aspiration_peak  성문 기식 노이즈 정점 (0.05≈-11dB, 0.1≈-5.5dB)
# 포먼트 전이 곡선은 여기서 그리지 않는다 — 조음 동역학이 만든다.
#   coarticulation: false 로 끄면 예전처럼 계단이 그대로 나간다.
name: 사 전이
sample_rate: 24000
seed: 3
speech_rate: 1.0
timeline:
  - {type: syllable, onset: s,  vowel: a,  dur: 0.55, f0: [150, 128]}
  - {type: silence,  dur: 0.12}
  - {type: syllable, onset: sh, vowel: i,  dur: 0.55, f0: [140, 120]}
  - {type: silence,  dur: 0.12}
  # 비음화: 연구개를 열면 비강 극-영점이 벌어진다 (닫으면 정확히 항등)
  - {type: vowel, vowel: a, dur: 0.6, velum_open: [[0, 0], [0.35, 0], [0.6, 1], [1, 1]]}
