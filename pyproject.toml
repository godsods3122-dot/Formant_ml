[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formant-ml"
version = "0.2.0"
description = "물리 기반(성문 소스 + 성도 공명 + 난류 노이즈) 미분가능 음성 합성"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

# 실시간 경로(numba)와 계측(praat-parselmouth)은 선택이다.
# 주의: 일부 컨테이너에서 torch 가 4 스레드 이상이면 원소별 연산이 1000 배 느려진다.
# OMP_NUM_THREADS=2 (또는 torch.set_num_threads(2)) 로 두라 — tests/engine/conftest.py 참조.

# YAML 스크립트(examples/*.yaml)는 pyyaml 이 있어야 읽는다. 없으면 JSON 으로 쓸 수
# 있으므로 하드 의존이 아니라 extra 로 둔다 (score.py::load_score 참조).
[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pyyaml>=6.0", "pytest>=7.0", "numba>=0.59", "praat-parselmouth>=0.4"]
realtime = ["numba>=0.59"]
measure = ["praat-parselmouth>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
